name: Mon Ami dbt wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            container: ''
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: monami-${{ matrix.target }}
          cache-bin: 'false'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        if: runner.os == 'macOS'
        with:
          python-version: '3.11'
      - name: Install protoc
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-*) platform=osx-universal_binary ;;
            Linux-x86_64) platform=linux-x86_64 ;;
            Linux-aarch64) platform=linux-aarch_64 ;;
          esac
          protoc_dir="$(mktemp -d)"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v29.4/protoc-29.4-$platform.zip" -o "$protoc_dir/protoc.zip"
          unzip -q "$protoc_dir/protoc.zip" -d "$protoc_dir"
          echo "$protoc_dir/bin" >> "$GITHUB_PATH"
      - name: Test BigQuery table listing
        shell: bash
        run: cargo +1.96.1 test --locked --release -p dbt-adapter --lib metadata::bigquery::tests::table_listing
      - name: Build and smoke-test wheel
        shell: bash
        run: |
          if [ -x /opt/python/cp311-cp311/bin/python ]; then
            python_bin=/opt/python/cp311-cp311/bin/python
          else
            python_bin=python3
          fi
          "$python_bin" -m venv .wheel-venv
          .wheel-venv/bin/pip install 'maturin>=1.0,<2.0'
          RUSTUP_TOOLCHAIN=1.96.1 .wheel-venv/bin/maturin build --release --locked \
            --target '${{ matrix.target }}' --interpreter "$python_bin" \
            -m crates/dbt-sa-python/Cargo.toml --out target/monami-wheels
          .wheel-venv/bin/pip install target/monami-wheels/*.whl
          .wheel-venv/bin/dbt --version
          .wheel-venv/bin/python -c 'from dbt.cli.main import cli; from dbt.runner import dbtRunner'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.target }}
          path: target/monami-wheels/*.whl
          if-no-files-found: error
